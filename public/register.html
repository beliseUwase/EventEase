
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | EventEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <a href="/" class="logo">EventEase</a>
        <nav>
            <a href="/">Home</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h1>Create your organizer account</h1>
            <p class="auth-subtitle">
                Start managing your events with EventEase.
            </p>

            <form id="registerForm">
                <label for="name">Full name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 8 characters"
                    minlength="8"
                    required
                >

                <button type="submit" class="primary-button auth-button">
                    Create Account
                </button>

                <p id="registerMessage" class="form-message"></p>
            </form>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>
        </div>
    </main>

    <script src="js/auth.js"></script>
</body>
</html>
