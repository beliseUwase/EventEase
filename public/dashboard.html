
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Organizer Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <header>
        <h1>EventEase</h1>
        <nav>
            <a href="/">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="events.html">Browse Events</a>
            <a href="#" id="logoutBtn">Logout</a>
        </nav>
    </header>

    <main>
        <h2>Organizer Dashboard</h2>

        <section id="welcomeSection">
            <h3>Welcome, <span id="organizerName">Organizer</span>!</h3>

            <p>Email: <span id="organizerEmail">Loading...</span></p>

            <p>Manage your events and RSVPs from here.</p>
        </section>

        <section id="eventsSection">
            <h3>Create a New Event</h3>

            <form id="eventForm">

                <label for="title">Event Title</label>
                <input type="text" id="title" name="title" required>

                <label for="description">Description</label>
                <textarea id="description" name="description" required></textarea>

                <label for="date">Event Date</label>
                <input type="date" id="date" name="date" required>

                <label for="time">Event Time</label>
                <input type="time" id="time" name="time" required>

                <label for="location">Location</label>
                <input type="text" id="location" name="location" required>

                <label for="maxAttendees">Maximum Attendees</label>
                <input
                    type="number"
                    id="maxAttendees"
                    name="maxAttendees"
                    min="1"
                    required
                >

                <button type="submit">Create Event</button>

            </form>

            <p id="eventMessage"></p>

            <h3>My Events</h3>
            <div id="eventList">
                <p>Your events will appear here.</p>
            </div>
        </section>

    </main>

    <script src="js/dashboard.js"></script>

</body>
</html>
